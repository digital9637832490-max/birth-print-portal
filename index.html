<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Birth Print Portal — Admin Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="brand-mark">BP</div>
      <h1>Birth Print Portal</h1>
      <p>Admin PDF Demo Generator</p>
      <input id="loginEmail" type="email" placeholder="Admin email" value="digital9637832490@gmail.com" autocomplete="username">
      <button id="loginBtn" class="primary full">Enter Dashboard</button>
      <small>Educational demo portal</small>
    </div>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">BP</div>
        <div><strong>Birth Print</strong><span>Portal</span></div>
      </div>
      <nav id="nav">
        <button class="nav-item active" data-page="dashboard">▦ <span>Dashboard</span></button>
        <button class="nav-item" data-page="generator">▤ <span>PDF Generator</span></button>
        <button class="nav-item" data-page="templates">▧ <span>Templates</span></button>
        <button class="nav-item" data-page="states">⌖ <span>States</span></button>
        <button class="nav-item" data-page="languages">文 <span>Languages</span></button>
        <button class="nav-item" data-page="fields">☷ <span>Form Fields</span></button>
        <button class="nav-item" data-page="history">◷ <span>PDF History</span></button>
        <button class="nav-item" data-page="settings">⚙ <span>Settings</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="demo-badge">DEMO MODE</div>
        <button id="logoutBtn" class="nav-item">↪ <span>Logout</span></button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <button id="mobileMenu" class="icon-btn">☰</button>
          <span class="eyebrow">ADMIN CONTROL CENTER</span>
          <h2 id="pageTitle">Dashboard</h2>
        </div>
        <div class="top-actions">
          <span id="clock"></span>
          <div class="avatar" id="adminAvatar">A</div>
        </div>
      </header>
      <section id="content" class="content"></section>
    </main>
  </div>

  <div id="toast" class="toast"></div>
  <script src="js/app.js"></script>
</body>
</html>
