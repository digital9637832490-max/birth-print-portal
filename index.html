<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Birth Print Portal — Admin Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>#adminLoginOverlay{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#f3f6fb;padding:20px}#adminLoginBox{width:min(420px,100%);background:#fff;border-radius:18px;padding:28px;box-shadow:0 18px 60px #0002}#adminLoginBox label{display:block;font-weight:600;margin:12px 0 6px}#adminLoginBox input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd3df;border-radius:10px}#adminLoginBtn{width:100%;margin-top:18px;padding:12px;border:0;border-radius:10px;cursor:pointer;font-weight:700}#adminLoginError{color:#c62828;margin-top:10px;min-height:20px}</style></head>
<body><div id="adminLoginOverlay"><div id="adminLoginBox"><h2>Admin Login</h2><p>Birth Print Portal — Admin Dashboard</p><label>Admin ID / Email</label><input id="adminLoginEmail" type="email" autocomplete="username" placeholder="Enter admin email"><label>Password</label><input id="adminLoginPassword" type="password" autocomplete="current-password" placeholder="Enter password"><button id="adminLoginBtn" type="button">Login</button><div id="adminLoginError"></div></div></div>
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="brand-mark">BP</div>
      <h1>Birth Print Portal</h1>
      <p>Admin PDF Demo Generator</p>
      <input id="loginEmail" type="email" placeholder="Admin email" value="digital9637832490@gmail.com" autocomplete="username">
      <button id="loginBtn" class="primary full">Enter Dashboard</button>
      <small>Educational demo portal</small>
    </div>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">BP</div>
        <div><strong>Birth Print</strong><span>Portal</span></div>
      </div>
      <nav id="nav">
        <button class="nav-item active" data-page="dashboard">▦ <span>Dashboard</span></button>
        <button class="nav-item" data-page="generator">▤ <span>PDF Generator</span></button>
        <button class="nav-item" data-page="templates">▧ <span>Templates</span></button>
        <button class="nav-item" data-page="states">⌖ <span>States</span></button>
        <button class="nav-item" data-page="languages">文 <span>Languages</span></button>
        <button class="nav-item" data-page="fields">☷ <span>Form Fields</span></button>
        <button class="nav-item" data-page="history">◷ <span>PDF History</span></button>
        <button class="nav-item" data-page="settings">⚙ <span>Settings</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="demo-badge">DEMO MODE</div>
        <button id="logoutBtn" class="nav-item">↪ <span>Logout</span></button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <button id="mobileMenu" class="icon-btn">☰</button>
          <span class="eyebrow">ADMIN CONTROL CENTER</span>
          <h2 id="pageTitle">Dashboard</h2>
        </div>
        <div class="top-actions">
          <span id="clock"></span>
          <div class="avatar" id="adminAvatar">A</div>
        </div>
      </header>
      <section id="content" class="content"></section>
    </main>
  </div>

  <div id="toast" class="toast"></div>
  <script src="js/app.js"></script>
<script>(function(){const E='digital9637832490@gmail.com',P='Nitesh@143',o=document.getElementById('adminLoginOverlay'),e=document.getElementById('adminLoginEmail'),p=document.getElementById('adminLoginPassword'),b=document.getElementById('adminLoginBtn'),x=document.getElementById('adminLoginError');function l(){if(e.value.trim().toLowerCase()===E&&p.value===P){sessionStorage.setItem('birthPrintAdminLoggedIn','1');o.style.display='none'}else{x.textContent='Invalid Admin ID or Password'}}b.onclick=l;p.onkeydown=a=>{if(a.key==='Enter')l()};if(sessionStorage.getItem('birthPrintAdminLoggedIn')==='1')o.style.display='none'})();</script></body>
</html>
